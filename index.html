<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊びの隠れ家 なんやかん屋 会員証</title>
  <style>
    /* ▼▼ 浮世絵デザイン（藍・紅・金・和紙、青海波文様）のカラー設定 ▼▼ */
    :root {
      --ai: #16324f;        /* 藍色 */
      --ai-deep: #0a1c2e;   /* 深藍 */
      --beni: #c9402f;      /* 紅色 */
      --beni-deep: #8f2a1f;
      --gold: #c9a15a;      /* 金 */
      --gold-light: #e8c878;
      --washi: #f4ecd8;     /* 和紙 */
    }
    /* 青海波（せいがいは）文様。同心の波弧を敷き詰めた、浮世絵で馴染み深い地模様 */
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background-color: var(--ai-deep);
      background-image:
        radial-gradient(circle at 0 100%, transparent 24%, rgba(201,161,90,0.16) 25%, rgba(201,161,90,0.16) 29%, transparent 30%, transparent 34%, rgba(201,161,90,0.10) 35%, rgba(201,161,90,0.10) 39%, transparent 40%),
        radial-gradient(circle at 100% 100%, transparent 24%, rgba(201,161,90,0.16) 25%, rgba(201,161,90,0.16) 29%, transparent 30%, transparent 34%, rgba(201,161,90,0.10) 35%, rgba(201,161,90,0.10) 39%, transparent 40%);
      background-size: 64px 32px;
      color: var(--washi); text-align: center; padding: 20px; margin: 0;
    }
    .container { max-width: 400px; margin: auto; background: var(--ai); border-radius: 6px; box-shadow: 0 10px 28px rgba(0,0,0,0.7); border: 2px solid var(--gold); position: relative; overflow: hidden; }
    .container::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(232,200,120,0.5); border-radius: 3px; pointer-events: none; }
    .card-inner { padding: 25px 15px; }

    /* 紅色の題箋（だいせん）帯 */
    .kanban { background: linear-gradient(180deg, var(--beni) 0%, var(--beni-deep) 100%); color: var(--washi); padding: 10px 0; font-size: 0.95rem; letter-spacing: 4px; font-weight: bold; border-bottom: 2px solid var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

    /* ロゴ画像のスタイル */
    #shop-logo { width: 80%; max-width: 250px; border-radius: 4px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid var(--gold); }

    h2 { color: var(--gold-light); font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 2px; }
    input[type="text"], input[type="tel"], input[type="email"] { padding: 12px; margin: 6px 0; border-radius: 3px; border: 1px solid var(--gold); font-size: 1rem; box-sizing: border-box; width: 94%; background: var(--washi); color: #2a2016; font-family: inherit; }
    input.invalid { box-shadow: 0 0 0 2px var(--beni); }
    .name-row { display: flex; justify-content: center; gap: 10px; width: 94%; margin: 0 auto; }
    .name-row input { width: 50%; }
    .address-group { width: 94%; margin: 15px auto; text-align: left; background: var(--ai-deep); padding: 15px 10px; border-radius: 4px; border: 1px solid rgba(201,161,90,0.5); }
    .address-group p { font-size: 0.8rem; color: var(--gold-light); margin: 0 0 10px 0; font-weight: bold; }

    /* 個人情報の取り扱いへの同意 */
    .consent { display: flex; align-items: flex-start; gap: 8px; width: 94%; margin: 15px auto; text-align: left; font-size: 0.85rem; line-height: 1.5; cursor: pointer; }
    .consent input { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 1px; }
    .consent.invalid { outline: 2px solid var(--beni); outline-offset: 6px; border-radius: 4px; }
    .consent a { color: var(--gold-light); }

    /* 紅×金のボタン */
    #submitBtn { width: 94%; padding: 15px; background: linear-gradient(135deg, var(--beni) 0%, #a83a2f 100%); color: var(--washi); border: 1px solid var(--gold); border-radius: 4px; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(201, 76, 63, 0.4); transition: 0.3s; font-family: inherit; letter-spacing: 1px; }
    #submitBtn:active { transform: scale(0.98); }
    #submitBtn:disabled { opacity: 0.6; cursor: default; }

    /* エラー・案内メッセージ */
    .msg { width: 94%; margin: 12px auto 0; padding: 10px; border-radius: 4px; font-size: 0.85rem; line-height: 1.5; text-align: left; background: #3a1f24; color: #ffc9c9; border: 1px solid var(--beni); white-space: pre-wrap; word-break: break-word; }
    .retry-btn { margin-top: 12px; padding: 10px 20px; background: var(--ai-deep); color: var(--gold-light); border: 1px solid var(--gold); border-radius: 4px; font-size: 0.9rem; cursor: pointer; }

    /* バーコード表示エリア（読み取りやすいようにここは白背景。紅×金の二重枠で額装のように見せる） */
    #barcodeCard { display: none; margin-top: 20px; background: var(--washi); padding: 20px 10px; border-radius: 4px; color: #2a2016; box-shadow: 0 0 18px rgba(201, 64, 47, 0.35); border: 3px double var(--beni); }
    #barcodeContainer { width: 100%; display: flex; justify-content: center; overflow: hidden; }
    #barcode { max-width: 100%; height: auto; }
    #membershipNumber { font-weight: bold; font-size: 1.6rem; letter-spacing: 3px; margin-top: 10px; color: var(--beni-deep); }
    #offlineNote { display: none; margin: 10px 0 0; font-size: 0.75rem; color: #888; }

    /* 店舗情報（古物営業法に基づく表示を含む） */
    .shop-info { max-width: 400px; margin: 25px auto 0; font-size: 0.75rem; line-height: 1.7; color: #a8b8c8; }
    .shop-info .shop-name { color: var(--gold-light); font-weight: bold; font-size: 0.85rem; margin: 0 0 8px; }
    .shop-info p { margin: 0 0 8px; }
    .shop-info a { color: var(--gold-light); }
  </style>
</head>
<body>
  <div class="container">
    <div class="kanban">遊びの隠れ家　会員証</div>
    <div class="card-inner">
    <img src="logo.jpg" id="shop-logo" alt="なんやかん屋 ロゴ">

    <div id="loading" style="color: #e3c780;">システム接続中...</div>
    <div id="startupError" style="display:none;">
      <div class="msg" id="startupErrorMsg"></div>
      <button class="retry-btn" onclick="location.reload()">もう一度試す</button>
    </div>

    <div id="registrationForm" style="display:none;" class="h-adr">
      <span class="p-country-name" style="display:none;">Japan</span>
      <div class="name-row"><input type="text" id="ln" placeholder="苗字"><input type="text" id="fn" placeholder="名前"></div>
      <div class="name-row"><input type="text" id="lnk" placeholder="ミョウジ"><input type="text" id="fnk" placeholder="ナマエ"></div>
      <div class="address-group">
        <p>※郵便番号で住所自動入力</p>
        <input type="tel" id="zip" class="p-postal-code" placeholder="郵便番号">
        <input type="text" id="pref" class="p-region" placeholder="都道府県">
        <input type="text" id="city" class="p-locality p-street-address" placeholder="市区町村・番地">
        <input type="text" id="bldg" class="p-extended-address" placeholder="建物名">
      </div>
      <input type="tel" id="phone" placeholder="電話番号">
      <input type="email" id="email" placeholder="メールアドレス（任意）">
      <label class="consent" id="consentRow">
        <input type="checkbox" id="agree">
        <span><a href="https://nanyakanya.net/pages/line-membership-privacy-policy" target="_blank" rel="noopener">個人情報の取り扱いについて</a>を読み、同意します</span>
      </label>
      <button id="submitBtn" onclick="register()">会員証を発行する</button>
      <div class="msg" id="formError" style="display:none;"></div>
    </div>

    <div id="barcodeCard">
      <p style="font-size: 0.8rem; margin:0 0 10px 0; color: #666;">デジタル会員証</p>
      <div id="barcodeContainer"><svg id="barcode"></svg></div>
      <p id="membershipNumber"></p>
      <p id="offlineNote">オフライン表示（前回取得した会員証）</p>
    </div>
    </div>
  </div>

  <footer class="shop-info">
    <p class="shop-name">遊びの隠れ家 なんやかん屋</p>
    <p>〒173-0034 東京都板橋区幸町1-14 アトラス大山102<br>東武東上線「大山駅」より徒歩5分</p>
    <p>営業時間 12:00〜20:00（定休日なし）<br>TEL 03-5926-9889／info@nanyakanya.net</p>
    <p>古物商許可 東京都公安委員会 第305591506374号</p>
    <p><a href="https://nanyakanya.net/pages/line-membership-privacy-policy" target="_blank" rel="noopener">個人情報の取り扱いについて</a></p>
  </footer>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
  <script>
    // ⚠️⚠️ ここに必ず新しいGASのURLを貼り付けてください！ ⚠️⚠️
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxEb_VUP7S81OM7pjCbOT6i4g6UoQApQTl51YHoA7MyT0gw5Yjx3Y4pomq4txC5gfjpEA/exec";
    const CACHE_KEY = "nk_member";
    const RELOGIN_KEY = "nk_relogin";
    let uid = "";        // 控えを誰のものか見分けるためだけに使う（サーバーへは送らない）
    let idToken = "";    // サーバーはこれをLINEに照会して本人を特定する

    function toFull(s) {
      if(!s) return "";
      let r = s.replace(/[A-Za-z0-9]/g, m => String.fromCharCode(m.charCodeAt(0) + 0xFEE0));
      return r.replace(/[ぁ-ゖ]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60)).replace(/ /g,"　");
    }

    function toHalf(s) {
      return s.replace(/[０-９]/g, m => String.fromCharCode(m.charCodeAt(0) - 0xFEE0));
    }

    function val(id) { return document.getElementById(id).value.trim(); }

    // 会員番号の控え。圏外やサーバー障害でも会員証を提示できるようにする。
    // プライベートブラウズ等で localStorage が使えないことがあるので必ず握りつぶす
    function saveCache(memberId) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ uid: uid, memberId: memberId })); } catch (e) {}
    }
    function loadCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) { return null; }
    }

    // 再ログインは1往復まで。判定できない端末ではループを避けて再ログインしない
    function canRelogin() {
      try {
        if (sessionStorage.getItem(RELOGIN_KEY) === "1") return false;
        sessionStorage.setItem(RELOGIN_KEY, "1");
        return true;
      } catch (e) { return false; }
    }
    function clearReloginFlag() {
      try { sessionStorage.removeItem(RELOGIN_KEY); } catch (e) {}
    }

    // IDトークンが古いときは liff.login() だけでは新しくならない。
    // LIFFが「ログイン済み」と判断して何もせず戻り、同じ古いトークンのままになるため、
    // 一度ログアウトしてから入り直させる
    function forceRelogin() {
      if (!canRelogin()) return false;
      try { liff.logout(); } catch (e) {}
      liff.login();
      return true;
    }

    // サーバーが原因を添えてきたら画面にも出す。問い合わせ時にそのまま伝えられるようにするため
    function withDetail(result) {
      return result && result.detail ? '\n\n［詳細］' + result.detail : '';
    }

    // Content-Type を指定しないこと。指定するとCORSのプリフライトが飛び、GASが応答できない
    async function callGas(payload) {
      payload.idToken = idToken;
      const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      return await response.json();
    }

    function showStartupError(text) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('registrationForm').style.display = 'none';
      document.getElementById('startupErrorMsg').innerText = text;
      document.getElementById('startupError').style.display = 'block';
    }

    function showFormError(text, badIds) {
      const box = document.getElementById('formError');
      box.innerText = text;
      box.style.display = 'block';
      ['ln','fn','lnk','fnk','pref','city','phone','email'].forEach(id => {
        document.getElementById(id).classList.remove('invalid');
      });
      document.getElementById('consentRow').classList.remove('invalid');
      (badIds || []).forEach(id => {
        const el = document.getElementById(id === 'agree' ? 'consentRow' : id);
        if (el) el.classList.add('invalid');
      });
      box.scrollIntoView({ block: 'nearest' });
    }

    // 入力チェック。問題があればメッセージを出して false を返す
    function validate() {
      const required = [
        ['ln', '苗字'], ['fn', '名前'],
        ['lnk', 'ミョウジ'], ['fnk', 'ナマエ'],
        ['pref', '都道府県'], ['city', '市区町村・番地'],
        ['phone', '電話番号']
      ];
      const empty = required.filter(([id]) => !val(id));
      if (empty.length) {
        showFormError('次の項目を入力してください：' + empty.map(([, label]) => label).join('、'), empty.map(([id]) => id));
        return false;
      }

      // 電話番号は数字10〜11桁（ハイフン・全角は許容して取り除く）
      const digits = toHalf(val('phone')).replace(/[-ー－\s]/g, '');
      if (!/^\d{10,11}$/.test(digits)) {
        showFormError('電話番号は数字10〜11桁で入力してください。', ['phone']);
        return false;
      }

      // メールは任意。入力された場合だけ形式を見る
      const email = val('email');
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFormError('メールアドレスの形式が正しくありません。空欄のままでも登録できます。', ['email']);
        return false;
      }

      if (!document.getElementById('agree').checked) {
        showFormError('個人情報の取り扱いについてご確認のうえ、同意にチェックしてください。', ['agree']);
        return false;
      }

      document.getElementById('formError').style.display = 'none';
      return true;
    }

    async function init() {
      const cache = loadCache();

      try {
        await liff.init({ liffId: "2009831421-Gb85ZD1F" });
      } catch (e) {
        // LINEに繋がらなくても、控えがあれば会員証だけは出す
        if (cache && cache.memberId) { showBarcode(cache.memberId, true); return; }
        showStartupError('LINEとの接続に失敗しました。通信状況を確認して、もう一度お試しください。それでも表示されない場合は店舗スタッフへお声がけください。');
        return;
      }

      if (!liff.isLoggedIn()) { liff.login(); return; }

      try {
        const p = await liff.getProfile();
        uid = p.userId;
      } catch (e) {
        if (cache && cache.memberId) { showBarcode(cache.memberId, true); return; }
        showStartupError('LINEの情報を取得できませんでした。もう一度お試しください。');
        return;
      }

      // 同じ人の控えがあれば先に出してしまう。待たされず、圏外でも提示できる
      const cachedForThisUser = cache && cache.uid === uid ? cache.memberId : null;
      if (cachedForThisUser) showBarcode(cachedForThisUser, true);

      // サーバーはこのトークンをLINEに照会して本人を確認する。取れないと何もできない
      idToken = liff.getIDToken();
      if (!idToken) {
        if (forceRelogin()) return;
        if (cachedForThisUser) return;
        showStartupError('LINEのログイン情報を取得できませんでした。LINEアプリから開き直してください。それでも表示されない場合は店舗スタッフへお声がけください。');
        return;
      }

      try {
        const result = await callGas({ action: "check" });
        if (result.status === "unauthorized") {
          if (forceRelogin()) return;
          if (cachedForThisUser) return;           // 控えを表示済みなのでそのままにする
          showStartupError('ログイン情報を確認できませんでした。LINEアプリから開き直してください。'
                           + withDetail(result));
          return;
        }
        clearReloginFlag();
        if (result.status === "found") {
          saveCache(result.memberId);
          showBarcode(result.memberId);            // 控えを出していた場合はここで最新に差し替わる
        } else if (cachedForThisUser) {
          // サーバー上に無いなら控えは古い。破棄して登録フォームへ戻す
          try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
          document.getElementById('barcodeCard').style.display = 'none';
          document.getElementById('registrationForm').style.display = 'block';
        } else {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('registrationForm').style.display = 'block';
        }
      } catch (e) {
        if (cachedForThisUser) return;             // 控えを表示済みなのでそのままにする
        showStartupError('サーバーに接続できませんでした。電波の良い場所でもう一度お試しください。');
      }
    }

    async function register() {
      if (!validate()) return;

      const btn = document.getElementById('submitBtn');
      const revert = () => { btn.innerText = "会員証を発行する"; btn.disabled = false; };
      btn.innerText = "登録中..."; btn.disabled = true;

      try {
        const result = await callGas({
          action: "register",
          name: toFull(val('ln') + " " + val('fn')),
          kana: toFull(val('lnk') + " " + val('fnk')),
          address: toFull(val('pref') + val('city') + " " + val('bldg')),
          phone: toFull(val('phone')),
          email: val('email')
        });
        if (result.status === "unauthorized") {
          showFormError('ログイン情報を確認できませんでした。LINEアプリから開き直してから、もう一度お試しください。'
                        + withDetail(result));
          revert();
        } else if (result.status === "success") {
          clearReloginFlag();
          saveCache(result.memberId);
          showBarcode(result.memberId);
        } else {
          // サーバーが success 以外を返した場合もボタンを戻す（押し直せるようにする）
          showFormError(result.message || '登録できませんでした。入力内容をご確認のうえ、もう一度お試しください。');
          revert();
        }
      } catch (e) {
        showFormError('通信に失敗しました。電波の良い場所でもう一度お試しください。');
        revert();
      }
    }

    function showBarcode(id, fromCache) {
      document.getElementById('registrationForm').style.display = 'none';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('startupError').style.display = 'none';
      document.getElementById('barcodeCard').style.display = 'block';
      document.getElementById('membershipNumber').innerText = id;
      document.getElementById('offlineNote').style.display = fromCache ? 'block' : 'none';

      // 会員番号が短い数字だとバーが細くなりすぎてレジのスキャナーが読み取れないため、
      // 4桁にゼロ埋めしてから CODE128 で描画し、バー幅・高さも大きくして読み取り精度を上げる
      const digitsOnly = /^[0-9]+$/.test(String(id));
      const value = digitsOnly ? String(id).padStart(4, '0') : String(id).toUpperCase();
      const container = document.getElementById('barcodeContainer');
      try {
        JsBarcode("#barcode", value, { format: "CODE128", displayValue: false, width: 3, height: 90, margin: 10 });
        container.style.display = 'flex';
      } catch (e) {
        // バーコードが出せなくても会員番号は読めるようにしておく
        container.style.display = 'none';
      }
    }
    init();
  </script>
</body>
</html>
